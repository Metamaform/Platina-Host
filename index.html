<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Platina Gift</title>
    <meta name="description" content="Platina Gift Shop and Crash Game" />
    <script>
      (function() {
        var _localFallback = {};
        var _sessionFallback = {};
        var createStorage = function(fallback) {
          return {
            getItem: function(k) { return fallback[k] || null; },
            setItem: function(k, v) { fallback[k] = v; },
            removeItem: function(k) { delete fallback[k]; },
            clear: function() { for (var k in fallback) delete fallback[k]; },
            get length() { return Object.keys(fallback).length; },
            key: function(i) { return Object.keys(fallback)[i] || null; }
          };
        };
        
        // Test localStorage
        var lsBlocked = false;
        try { window.localStorage.getItem('test'); } catch(e) { lsBlocked = true; }
        
        if (lsBlocked) {
          try {
            Object.defineProperty(window, 'localStorage', { get: function() { return createStorage(_localFallback); }, configurable: true });
          } catch(e) {}
          try {
            Object.defineProperty(Window.prototype, 'localStorage', { get: function() { return createStorage(_localFallback); }, configurable: true });
          } catch(e) {}
        }
        
        // Test sessionStorage
        var ssBlocked = false;
        try { window.sessionStorage.getItem('test'); } catch(e) { ssBlocked = true; }
        
        if (ssBlocked) {
          try {
            Object.defineProperty(window, 'sessionStorage', { get: function() { return createStorage(_sessionFallback); }, configurable: true });
          } catch(e) {}
          try {
            Object.defineProperty(Window.prototype, 'sessionStorage', { get: function() { return createStorage(_sessionFallback); }, configurable: true });
          } catch(e) {}
        }
      })();
    </script>
    <script>
      window.addEventListener('error', function(e) {
        document.body.innerHTML += '<div style="background:red;color:white;padding:20px;position:fixed;top:0;left:0;z-index:999999;width:100%;word-wrap:break-word;">Global Error: ' + e.message + '<br/><pre style="font-size:10px">' + (e.error ? e.error.stack : '') + '</pre></div>';
      });
      window.addEventListener('unhandledrejection', function(e) {
        const reasonStr = (e.reason && e.reason.message ? e.reason.message : String(e.reason));
        if (reasonStr.includes('WebSocket closed without opened') || reasonStr.includes('ws://')) {
          e.preventDefault();
          return;
        }
        document.body.innerHTML += '<div style="background:orange;color:white;padding:20px;position:fixed;top:0;left:0;z-index:999999;width:100%;word-wrap:break-word;">Promise Rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '<br/><pre style="font-size:10px">' + (e.reason && e.reason.stack ? e.reason.stack : '') + '</pre></div>';
      });
    </script>
    <script>
      window.global = window;
      var process = { env: {} };
    </script>
    <meta property="og:title" content="Platina Gift" />
    <meta property="og:description" content="Platina Gift Shop and Crash Game" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
